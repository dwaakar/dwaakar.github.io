backend:
  name: github
  repo: dwaakar/dwaakar.github.io
  branch: main
  base_url: https://dwaakar-github-io.pages.dev
  auth_endpoint: /api/auth
  squash_merges: true
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'


media_folder: "images"
public_folder: "/images"

collections:

  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - name: "general"
        label: "Personal Info, Bio & Social Links"
        file: "content/settings.json"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
          - { label: "Profile Photo", name: "photo", widget: "image", required: false }
          - { label: "Bio (shown on hero)", name: "bio", widget: "text", required: false }
          - label: "Typing Taglines"
            name: "taglines"
            widget: "list"
            required: false
            field: { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Research Objective", name: "aboutResearchObjective", widget: "text", required: false }
          - label: "Research Interests"
            name: "researchInterests"
            widget: "list"
            required: false
            field: { label: "Interest", name: "interest", widget: "string" }
          - { label: "Professional Objective", name: "aboutProfessionalObjective", widget: "text", required: false }
          - label: "Professional Interests"
            name: "professionalInterests"
            widget: "list"
            required: false
            field: { label: "Interest", name: "interest", widget: "string" }
          - { label: "Academic CV (PDF)", name: "cvAcademic", widget: "file", required: false }
          - { label: "Professional CV (PDF)", name: "cvProfessional", widget: "file", required: false }
          - { label: "GitHub URL", name: "github", widget: "string", required: false }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Storygraph URL", name: "storygraph", widget: "string", required: false }
          - label: "── Section Visibility (toggle to show/hide entire sections) ──"
            name: "secVisLabel"
            widget: "hidden"
            default: ""
          - { label: "Show About Section", name: "showAbout", widget: "boolean", default: true, required: false }
          - { label: "Show Projects Section", name: "showProjects", widget: "boolean", default: true, required: false }
          - { label: "Show Publications Section", name: "showPublications", widget: "boolean", default: true, required: false }
          - { label: "Show Experience Section", name: "showExperience", widget: "boolean", default: true, required: false }
          - { label: "Show Skills Section", name: "showSkills", widget: "boolean", default: true, required: false }
          - label: "── Section Order (drag to reorder) ──"
            name: "sectionOrderLabel"
            widget: "hidden"
            default: ""
          - label: "── Journey Timeline ──"
            name: "timelineLabel"
            widget: "hidden"
            default: ""
          - label: "Timeline Milestones"
            name: "milestones"
            widget: "list"
            required: false
            hint: "Each milestone appears as a card on the horizontal timeline. Drag to reorder."
            fields:
              - { label: "Year / Date", name: "year", widget: "string", hint: "e.g. 2024 or Jan 2024", required: true }
              - { label: "Display Date (optional)", name: "date", widget: "string", required: false, hint: "Shown on card — e.g. March 2024. Falls back to Year if empty." }
              - label: "Elevation"
                name: "elevation"
                widget: "select"
                required: false
                default: 3000
                hint: "Position on the river AND the icon: ≥5750m=🧊Glacier, 4750-5749m=🪨Huge Rock, 3500-4749m=⛰️Landslide, 2250-3499m=🪵Driftwood, 1000-2249m=🌿Riparian Vegetation, 250-999m=🌉River Crossing, <250m=🌊River Mouth."
                options:
                  - { label: "6500 m — Glacial Source / Summit", value: 6500 }
                  - { label: "6250 m — High Glacial", value: 6250 }
                  - { label: "6000 m — High Alpine", value: 6000 }
                  - { label: "5750 m — Upper Glacial Zone", value: 5750 }
                  - { label: "5500 m — Glacial Zone", value: 5500 }
                  - { label: "5250 m — High Mountain Pass", value: 5250 }
                  - { label: "5000 m — High Mountain", value: 5000 }
                  - { label: "4750 m — Upper Alpine", value: 4750 }
                  - { label: "4500 m — Alpine Meadow", value: 4500 }
                  - { label: "4250 m — Upper Treeline", value: 4250 }
                  - { label: "4000 m — Treeline", value: 4000 }
                  - { label: "3750 m — Subalpine Forest Edge", value: 3750 }
                  - { label: "3500 m — Subalpine", value: 3500 }
                  - { label: "3250 m — Upper Mid-Mountain", value: 3250 }
                  - { label: "3000 m — Mid-Mountain", value: 3000 }
                  - { label: "2750 m — Lower Mid-Mountain", value: 2750 }
                  - { label: "2500 m — Lower Mountain", value: 2500 }
                  - { label: "2250 m — Upper Hill Zone", value: 2250 }
                  - { label: "2000 m — Hill Zone", value: 2000 }
                  - { label: "1750 m — Lower Hill Zone", value: 1750 }
                  - { label: "1500 m — Upper Hills", value: 1500 }
                  - { label: "1250 m — Mid Hills", value: 1250 }
                  - { label: "1000 m — Lower Hills", value: 1000 }
                  - { label: "750 m — Upper Foothills", value: 750 }
                  - { label: "500 m — Foothills / Terai Edge", value: 500 }
                  - { label: "250 m — Terai / Lowland", value: 250 }
                  - { label: "60 m — River Mouth / Floodplain", value: 60 }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false, hint: "Shown on the card when expanded." }
              - { label: "Subtitle / Institution", name: "sub", widget: "string", required: false, hint: "e.g. Tribhuvan University" }
              - { label: "Icon (emoji)", name: "icon", widget: "string", required: false, default: "📌" }
          - label: "── Statistics Counter Bar ──"
            name: "statsLabel"
            widget: "hidden"
            default: ""
          - label: "Stats"
            name: "stats"
            widget: "list"
            required: false
            hint: "Each stat appears as an animated counter. Leave empty to use defaults."
            fields:
              - { label: "Number (digits only)", name: "value", widget: "string", hint: "e.g. 100" }
              - { label: "Label", name: "label", widget: "string", hint: "e.g. Districts Visited" }
              - { label: "Prefix (optional)", name: "prefix", widget: "string", required: false, hint: "e.g. $" }
              - { label: "Suffix (optional)", name: "suffix", widget: "string", required: false, hint: "e.g. K+ or +" }
          - label: "Section Order"
            name: "sectionOrder"
            widget: "list"
            required: false
            hint: "Drag to reorder sections. Use exact IDs: about, projects, publications, experience, skills. Leave empty for default order."
            field: { label: "Section ID", name: "item", widget: "select", options: ["about","projects","publications","experience","skills"] }
          - label: "Custom Social Links"
            name: "customSocials"
            widget: "list"
            required: false
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Emoji Icon", name: "icon", widget: "string", default: "🔗" }

  - name: "education"
    label: "🎓 Education"
    folder: "content/education"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Degree Title", name: "title", widget: "string" }
      - { label: "Institution", name: "institution", widget: "string" }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Grade / GPA", name: "grade", widget: "string", required: false }
      - { label: "Specialisation", name: "specialisation", widget: "string", required: false }
      - { label: "Thesis Title", name: "thesis", widget: "string", required: false }
      - label: "Key Coursework"
        name: "coursework"
        widget: "list"
        required: false
        field: { label: "Course", name: "course", widget: "string" }
      - { label: "Detail / Description", name: "body", widget: "markdown", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false, media_folder: "images", public_folder: "/images" }
      - label: "Detail Images (auto-slideshow every 3 seconds)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image", media_folder: "images", public_folder: "/images" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - { label: "Link", name: "link", widget: "string", required: false }
      - label: "Display Mode"
        name: "displayMode"
        widget: "select"
        options:
          - { label: "Popup only", value: "popup" }
          - { label: "Popup + Full Page", value: "fullpage" }
        default: "popup"
      - label: "── What to show in Popup (turn all off = no popup content) ──"
        name: "popupVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Popup] Show Images / Slideshow", name: "showGallery", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Description/Detail", name: "showDetail", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Coursework", name: "showCoursework", widget: "boolean", default: false, required: false }
      - label: "── What to show on Full Page (turn all off = blank page) ──"
        name: "fullpageVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Full Page] Show Short Description", name: "fpShowShortDesc", widget: "boolean", default: true, required: false }
      - { label: "[Full Page] Show Images / Slideshow", name: "fpShowGallery", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Description/Detail", name: "fpShowDetail", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Coursework", name: "fpShowCoursework", widget: "boolean", default: false, required: false }
      - { label: "Sort Order", name: "order", widget: "number", default: 99 }

  - name: "skills"
    label: "🛠️ Skills"
    files:
      - name: "skills"
        label: "Skill Groups"
        file: "content/skills.json"
        fields:
          - label: "Skill Groups"
            name: "items"
            widget: "list"
            fields:
              - { label: "Group Name", name: "group", widget: "string" }
              - label: "Skills"
                name: "items"
                widget: "list"
                field: { label: "Skill", name: "skill", widget: "string" }

  - name: "projects"
    label: "📁 Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Short Description"
        name: "shortDesc"
        widget: "markdown"
        required: false
        hint: "Always shown first in the popup — keep it under 250 words. Supports bold, italic, headings, and bullet points."
      - { label: "Full Detail", name: "body", widget: "markdown", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Status / Role", name: "status", widget: "string", required: false }
      - { label: "Organisation / Institution", name: "organisation", widget: "string", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Research", value: "research" }
          - { label: "Community", value: "community" }
        default: "research"
      - label: "Filter Tags"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Cover Image", name: "image", widget: "image", required: false, media_folder: "images", public_folder: "/images" }
      - label: "Detail Images (auto-slide for community, manual slider for research)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image", media_folder: "images", public_folder: "/images" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - { label: "YouTube Video URL", name: "videoUrl", widget: "string", required: false }
      - label: "Downloadable Report"
        name: "report"
        widget: "object"
        required: false
        fields:
          - { label: "PDF File", name: "file", widget: "file", required: false }
          - { label: "Button Label", name: "label", widget: "string", default: "Download Report", required: false }
      - label: "Related Publications"
        name: "relatedPubs"
        widget: "list"
        required: false
        field: { label: "Publication", name: "pub", widget: "string" }
      - label: "Display Mode"
        name: "displayMode"
        widget: "select"
        options:
          - { label: "Popup only", value: "popup" }
          - { label: "Popup + Full Page", value: "fullpage" }
        default: "popup"
      - { label: "External Link", name: "link", widget: "string", required: false }
      - label: "── What to show in Popup (turn all off = no popup content) ──"
        name: "popupVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Popup] Show Images / Slideshow", name: "showGallery", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Description/Detail", name: "showDetail", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Video", name: "showVideo", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Report Download", name: "showReport", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Related Publications", name: "showRelatedPubs", widget: "boolean", default: false, required: false }
      - label: "── What to show on Full Page (turn all off = blank page) ──"
        name: "fullpageVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Full Page] Show Short Description", name: "fpShowShortDesc", widget: "boolean", default: true, required: false }
      - { label: "[Full Page] Show Images / Slideshow", name: "fpShowGallery", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Description/Detail", name: "fpShowDetail", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Video", name: "fpShowVideo", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Report Download", name: "fpShowReport", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Related Publications", name: "fpShowRelatedPubs", widget: "boolean", default: false, required: false }
      - { label: "Sort Order", name: "order", widget: "number", default: 99 }

  - name: "publications"
    label: "📚 Publications"
    folder: "content/publications"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Journal / Book", name: "journal", widget: "string", required: false }
      - { label: "Publication Status", name: "status", widget: "string", required: false, hint: "e.g. Published, Under Review, Accepted, Submitted" }
      - { label: "Publication Type / Category", name: "category", widget: "string", required: false, hint: "e.g. Research Article, Book Chapter, Conference Paper, Policy Brief" }
      - { label: "DOI / URL", name: "doi", widget: "string", required: false }
      - { label: "Abstract", name: "abstract", widget: "text", required: false }
      - { label: "Detailed Overview", name: "body", widget: "markdown", required: false }
      - label: "Images (slideshow if multiple, static if one)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image", media_folder: "images", public_folder: "/images" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - { label: "External Link", name: "link", widget: "string", required: false }
      - label: "Display Mode"
        name: "displayMode"
        widget: "select"
        options:
          - { label: "Popup only", value: "popup" }
          - { label: "Popup + Full Page", value: "fullpage" }
        default: "popup"
      - label: "── What to show in Popup (turn all off = no popup content) ──"
        name: "popupVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Popup] Show Images / Slideshow", name: "showGallery", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Abstract", name: "showAbstract", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Detail/Overview", name: "showDetail", widget: "boolean", default: false, required: false }
      - label: "── What to show on Full Page (turn all off = blank page) ──"
        name: "fullpageVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Full Page] Show Short Description", name: "fpShowShortDesc", widget: "boolean", default: true, required: false }
      - { label: "[Full Page] Show Images / Slideshow", name: "fpShowGallery", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Abstract", name: "fpShowAbstract", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Detail/Overview", name: "fpShowDetail", widget: "boolean", default: false, required: false }
      - { label: "Sort Order", name: "order", widget: "number", default: 99 }

  - name: "experience"
    label: "💼 Work Experience"
    folder: "content/experience"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Job Title / Role", name: "title", widget: "string" }
      - { label: "Organisation", name: "organisation", widget: "string" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Start Date", name: "startDate", widget: "string", hint: "e.g. Jan 2022 or 2022" }
      - { label: "End Date", name: "endDate", widget: "string", required: false, hint: "Leave blank if current" }
      - { label: "Currently Working Here", name: "current", widget: "boolean", default: false }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Research", value: "research" }
          - { label: "Work", value: "work" }
          - { label: "Consultancy", value: "consultancy" }
        default: "work"
      - label: "Short Description"
        name: "shortDesc"
        widget: "markdown"
        required: false
        hint: "Always shown first in the popup — keep it under 250 words. Supports bold, italic, headings, and bullet points."
      - { label: "Full Detail", name: "body", widget: "markdown", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false, media_folder: "images", public_folder: "/images" }
      - label: "Images (slideshow)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image", media_folder: "images", public_folder: "/images" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - label: "Display Mode"
        name: "displayMode"
        widget: "select"
        options:
          - { label: "Popup only", value: "popup" }
          - { label: "Popup + Full Page", value: "fullpage" }
        default: "popup"
      - { label: "Sort Order", name: "order", widget: "number", default: 99 }
      - label: "── What to show in Popup ──"
        name: "popupVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Popup] Show Cover Image", name: "showImage", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Images / Slideshow", name: "showGallery", widget: "boolean", default: false, required: false }
      - { label: "[Popup] Show Description", name: "showDetail", widget: "boolean", default: false, required: false }
      - label: "── What to show on Full Page ──"
        name: "fullpageVisLabel"
        widget: "hidden"
        default: ""
      - { label: "[Full Page] Show Short Description", name: "fpShowShortDesc", widget: "boolean", default: true, required: false }
      - { label: "[Full Page] Show Cover Image", name: "fpShowImage", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Images / Slideshow", name: "fpShowGallery", widget: "boolean", default: false, required: false }
      - { label: "[Full Page] Show Description", name: "fpShowDetail", widget: "boolean", default: false, required: false }

  - name: "map"
    label: "🗺️ Nepal District Map"
    files:
      - name: "map"
        label: "Field Presence Map"
        file: "content/map.json"
        description: "Add districts where you have worked. Each district is colour-coded by activity type."
        fields:
          - label: "Districts"
            name: "districts"
            widget: "list"
            fields:
              - label: "District Name"
                name: "name"
                widget: "select"
                options: ["ACHHAM","ARGHAKHANCHI","BAGLUNG","BAITADI","BAJHANG","BAJURA","BANKE","BARA","BARDIYA","BHAKTAPUR","BHOJPUR","CHITWAN","DADELDHURA","DAILEKH","DANG","DARCHULA","DHADING","DHANKUTA","DHANUSA","DOLAKHA","DOLPA","DOTI","GORKHA","GULMI","HUMLA","ILAM","JAJARKOT","JHAPA","JUMLA","KAILALI","KALIKOT","KANCHANPUR","KAPILBASTU","KASKI","KATHMANDU","KAVRE","KHOTANG","LALITPUR","LAMJUNG","MAHOTTARI","MAKWANPUR","MANANG","MORANG","MUGU","MUSTANG","MYAGDI","NAWALPARASI","NUWAKOT","OKHALDHUNGA","PALPA","PANCHTHAR","PARBAT","PARSA","PYUTHAN","RAMECHHAP","RASUWA","RAUTAHAT","ROLPA","RUKUM","RUPANDEHI","SALYAN","SANKHUWASABHA","SAPTARI","SARLAHI","SINDHULI","SINDHUPALCHOK","SIRAHA","SOLUKHUMBU","SUNSARI","SURKHET","SYANGJA","TANAHU","TAPLEJUNG","TEHRATHUM","UDAYAPUR"]
              - label: "Activity Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "Research", value: "research" }
                  - { label: "Community Project", value: "community" }
                  - { label: "Environmental Impact Assessment", value: "eia" }
                  - { label: "District Visited", value: "visited" }
                  - { label: "Other", value: "other" }
              - { label: "Project Name", name: "project", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false, hint: "e.g. 2023 or 2021–2024" }
              - { label: "Note", name: "note", widget: "text", required: false, hint: "Short description shown in popup" }

  - name: "sections"
    label: "📂 Custom Sections"
    files:
      - name: "sections"
        label: "Manage Custom Sections"
        file: "content/sections.json"
        description: "Add a new section here, then add items to it via Custom Section Items below."
        fields:
          - label: "Custom Sections"
            name: "root"
            widget: "list"
            fields:
              - { label: "Section ID (no spaces, lowercase, e.g. fieldwork)", name: "id", widget: "string" }
              - { label: "Section Title (shown on site)", name: "title", widget: "string" }
              - { label: "Icon (emoji)", name: "icon", widget: "string", default: "📌", required: false }
              - label: "Display Style"
                name: "display"
                widget: "select"
                options:
                  - { label: "Cards (like Projects)", value: "cards" }
                  - { label: "Timeline (like Experience)", value: "timeline" }
                default: "cards"
              - { label: "Visible on Site", name: "visible", widget: "boolean", default: true }

  - name: "custom_items"
    label: "📝 Custom Section Items"
    folder: "content/custom"
    create: true
    slug: "{{sectionId}}-{{slug}}"
    fields:
      - label: "Section"
        name: "sectionId"
        widget: "string"
        hint: "Must match the Section ID exactly (e.g. fieldwork)"
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Organisation / Institution", name: "organisation", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Year / Start Date", name: "year", widget: "string", required: false }
      - { label: "Start Date", name: "startDate", widget: "string", required: false, hint: "e.g. Jan 2022 (for timeline display)" }
      - { label: "End Date", name: "endDate", widget: "string", required: false }
      - { label: "Currently Active", name: "current", widget: "boolean", default: false, required: false }
      - { label: "Type / Role Label", name: "type", widget: "string", required: false, hint: "e.g. Lead Researcher, Participant" }
      - label: "Short Description"
        name: "shortDesc"
        widget: "markdown"
        required: false
        hint: "Always shown first in the popup — keep it under 250 words. Supports bold, italic, headings, and bullet points."
      - { label: "Full Detail", name: "body", widget: "markdown", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false, media_folder: "images", public_folder: "/images" }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image", media_folder: "images", public_folder: "/images" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "External Link", name: "link", widget: "string", required: false }
      - label: "Display Mode"
        name: "displayMode"
        widget: "select"
        options:
          - { label: "Popup only", value: "popup" }
          - { label: "Popup + Full Page", value: "fullpage" }
        default: "popup"
      - { label: "Sort Order", name: "order", widget: "number", default: 99 }
