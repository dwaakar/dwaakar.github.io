name: Sync Goodreads library

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-goodreads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund fast-xml-parser sharp
      - name: Fetch Goodreads shelves
        env:
          GOODREADS_RSS_URL: ${{ secrets.GOODREADS_RSS_URL }}
        run: node scripts/sync-goodreads.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Goodreads library"
            git pull --rebase
            git push
          fi
