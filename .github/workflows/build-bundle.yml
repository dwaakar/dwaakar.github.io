name: Build content bundle

# GitHub Pages serves the repo files as-is and does not run build.js.
# This workflow runs it for you and commits content/bundle.json, so the site
# can load all content in ONE request. Runs whenever content changes.

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundle
        run: node build.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: rebuild content bundle"
            git pull --rebase
            git push
          fi
